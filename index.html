<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tower Realm — Tower Defense</title>
<style>
  :root {
    --bg: #1b1f2a;
    --panel: #232838;
    --ink: #e8ecf4;
    --muted: #9aa4bd;
    --gold: #ffcf52;
    --accent: #5ad1a5;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app {
    display: flex; flex-direction: column; align-items: center;
    min-height: 100%; padding: 16px; gap: 12px;
  }
  h1 { margin: 4px 0 0; font-size: 20px; letter-spacing: .5px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  #hud {
    display: flex; gap: 18px; align-items: center;
    background: var(--panel); padding: 10px 18px; border-radius: 10px;
    font-variant-numeric: tabular-nums; font-size: 15px;
  }
  #hud .stat b { color: var(--gold); }
  #hud .lives b { color: var(--danger); }
  #hud .wave b { color: var(--accent); }
  #hud .hero b { color: #e0a83a; }
  #stage {
    position: relative;
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,.4);
    width: min(900px, 100%);
  }

  /* bottom-left action bar: hero portrait + ability squares, all the same
     footprint so they read as one control cluster */
  #abilityBar { position: absolute; left: 10px; bottom: 10px; z-index: 4; display: flex; gap: 8px; }
  #abilityBar button {
    position: relative;
    width: 58px; height: 58px; border-radius: 10px; padding: 0;
    background: linear-gradient(160deg, #4a3a12, #241b08);
    border: 2px solid #e0a83a; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,.45);
  }
  #abilityBar button:hover { border-color: #ffcf52; }
  #abilityBar .icon { font-size: 26px; line-height: 1; }

  /* hero portrait specifics: selection glow, HP bar, downed state */
  #heroPortrait.selected { border-color: #5ad1a5; box-shadow: 0 0 0 3px rgba(90,209,165,.4); }
  #heroPortrait .hp-bar {
    position: absolute; left: 5px; right: 5px; bottom: 5px; height: 4px;
    background: rgba(0,0,0,.55); border-radius: 2px; overflow: hidden;
  }
  #heroPortrait .hp-fill { height: 100%; width: 100%; background: #5ad1a5; }
  #heroPortrait .lvl-badge {
    position: absolute; top: -7px; right: -7px;
    width: 20px; height: 20px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 11px; font-weight: 800; color: #10141c;
    background: radial-gradient(circle at 35% 30%, #ffe9a8, #ffcf52 60%, #d9a222);
    border: 2px solid #fff3d0; box-shadow: 0 2px 6px rgba(0,0,0,.5);
  }
  #heroPortrait .xp-bar {
    position: absolute; left: 5px; right: 5px; bottom: 11px; height: 3px;
    background: rgba(0,0,0,.55); border-radius: 2px; overflow: hidden;
  }
  #heroPortrait .xp-fill { height: 100%; width: 0; background: var(--gold); }
  #heroPortrait.downed .lvl-badge, #heroPortrait.downed .xp-bar { visibility: hidden; }
  #heroPortrait.downed { cursor: default; border-color: #545b68; }
  #heroPortrait.downed .icon, #heroPortrait.downed .hp-bar { visibility: hidden; }
  #heroPortrait .downed-label {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: var(--gold);
  }
  #heroPortrait.downed .downed-label { display: flex; }

  /* ability squares: greyed out + countdown while on cooldown */
  .ability-btn.cooling { cursor: default; border-color: #545b68; }
  .ability-btn.cooling .icon { opacity: .3; }
  .ability-btn .cd-label {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; color: var(--ink); background: rgba(10,12,18,.55); border-radius: 8px;
  }
  .ability-btn.cooling .cd-label { display: flex; }
  canvas { display: block; width: 100%; height: auto; }
  #controls { display: flex; gap: 10px; align-items: center; }
  button {
    background: var(--accent); color: #0c1a14; border: 0;
    padding: 9px 16px; border-radius: 8px; font-weight: 600; font-size: 14px;
    cursor: pointer;
  }
  button.secondary { background: var(--panel); color: var(--ink); }
  button:disabled { opacity: .5; cursor: default; }
  #tip { color: var(--muted); font-size: 13px; min-height: 18px; }

  /* radial-ish build menu that pops up over a build spot */
  #buildMenu {
    position: absolute; display: none;
    transform: translate(-50%, -50%);
    z-index: 5;
    background: rgba(20,24,34,.96);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px; padding: 8px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
  }
  #buildMenu.show { display: grid; }
  #buildMenu {
    grid-template-columns: repeat(2, 92px); gap: 6px;
  }
  .tower-opt {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: var(--panel); color: var(--ink);
    padding: 8px 6px; border-radius: 9px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.06); font-weight: 500;
  }
  .tower-opt:hover:not(:disabled) { border-color: var(--accent); }
  .tower-opt .ic { font-size: 22px; line-height: 1; }
  .tower-opt .nm { font-size: 12px; }
  .tower-opt .ct { font-size: 12px; color: var(--gold); font-variant-numeric: tabular-nums; }
  .tower-opt:disabled { opacity: .45; cursor: default; }

  /* manage menu for an existing tower (upgrade / sell) */
  #towerMenu {
    position: absolute; display: none;
    transform: translate(-50%, -50%); z-index: 6;
    background: rgba(20,24,34,.96);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px; padding: 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
    min-width: 156px;
  }
  #towerMenu.show { display: flex; flex-direction: column; gap: 8px; }
  #towerMenu .thead { font-size: 13px; color: var(--muted); text-align: center; }
  #towerMenu .thead b { color: var(--ink); }
  #towerMenu .stars { color: var(--gold); letter-spacing: 3px; font-size: 13px; margin-top: 2px; }
  #towerMenu button { font-size: 13px; padding: 8px 10px; }
  #towerMenu .up { background: var(--accent); color: #0c1a14; }
  /* specialisation branches: wider than a normal row, because the whole
     point is reading what each path does before committing to it */
  #towerMenu .spec-note {
    font-size: 11px; color: var(--gold); text-align: center;
    letter-spacing: .5px; margin-top: 2px;
  }
  #towerMenu .spec {
    display: grid; grid-template-columns: 1fr auto; gap: 2px 8px;
    text-align: left; background: #2c2438; color: var(--ink);
    border: 1px solid rgba(255,207,82,.35); max-width: 232px;
  }
  #towerMenu .spec:hover:not(:disabled) { border-color: var(--gold); background: #362b46; }
  #towerMenu .spec .sp-name { font-weight: 700; font-size: 12px; }
  #towerMenu .spec .sp-cost { color: var(--gold); font-size: 12px; }
  #towerMenu .spec .sp-blurb {
    grid-column: 1 / -1; font-size: 10.5px; color: var(--muted);
    font-weight: 400; line-height: 1.35; white-space: normal;
  }
  #towerMenu .move { background: #3a4a66; color: var(--ink); }
  #towerMenu .sell { background: #3a2230; color: #ffb3c1; }
  #towerMenu button:disabled { opacity: .45; cursor: default; }

  #overlay {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    background: rgba(10,12,18,.82); text-align: center; gap: 10px; z-index: 10;
  }
  #overlay h2 { margin: 0; font-size: 34px; }
  #overlay.show { display: flex; }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
    color: var(--muted); font-size: 12px; max-width: 900px; }
  .legend b { color: var(--ink); }

  #overlayBtns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  /* view toggling: exactly one of slot-select / world-map / play is shown,
     controlled by a single view-* class on <body> (see dom.js setView()). */
  #slotScreen, #mapScreen, #playView {
    display: none; flex-direction: column; align-items: center; gap: 12px; width: min(900px, 100%);
  }
  body.view-slots #slotScreen { display: flex; }
  body.view-map #mapScreen { display: flex; }
  body.view-play #playView { display: flex; }

  /* stage select — five chapter cards, each a doorway into ten levels */
  #stageBoard {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr));
    gap: 12px; width: min(900px, 100%);
  }
  /* the id rule above outranks the UA [hidden] rule, so restate it */
  #stageBoard[hidden] { display: none; }
  .stage-card {
    position: relative; text-align: left; cursor: pointer;
    display: flex; flex-direction: column; gap: 6px;
    padding: 14px 14px 12px; border-radius: 12px;
    border: 1px solid rgba(255,243,208,.14); color: var(--ink);
    background: linear-gradient(165deg, rgba(255,243,208,.08), rgba(16,20,28,.5));
    box-shadow: 0 6px 22px rgba(0,0,0,.35);
    transition: transform .12s, border-color .12s;
  }
  .stage-card:not(.locked):hover { transform: translateY(-3px); border-color: rgba(255,207,82,.55); }
  .stage-card .st-num {
    font-size: 11px; letter-spacing: 3px; color: var(--gold); font-weight: 700;
  }
  .stage-card .st-name { font-size: 15px; font-weight: 700; line-height: 1.2; }
  .stage-card .st-blurb { font-size: 11px; color: var(--muted); line-height: 1.35; min-height: 30px; }
  .stage-card .st-icon { position: absolute; top: 10px; right: 12px; font-size: 22px; opacity: .85; }
  .stage-card .st-bar {
    height: 5px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden;
  }
  .stage-card .st-bar i { display: block; height: 100%; background: linear-gradient(90deg, #ffcf52, #5ad1a5); }
  .stage-card .st-foot { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .stage-card .st-foot .st-stars { color: var(--gold); }
  .stage-card.locked { opacity: .55; cursor: default; }
  .stage-card.locked .st-name { color: var(--muted); }
  #backToStages { align-self: flex-start; }

  /* world map */
  #mapBoard {
    position: relative; width: min(900px, 100%); aspect-ratio: 900 / 560;
    border-radius: 12px; overflow: hidden;
    background:
      radial-gradient(120% 100% at 20% 0%, #3a6b8c 0%, #294c66 55%, #1e3550 100%),
      linear-gradient(160deg, #35617f, #22415a);
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
  }
  #mapTrail { position: absolute; inset: 0; width: 100%; height: 100%; }
  #mapNodes { position: absolute; inset: 0; }
  .map-node {
    position: absolute; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    background: none; border: 0; padding: 0; cursor: pointer;
  }
  .map-node .disc {
    width: 58px; height: 58px; border-radius: 50%;
    display: grid; place-items: center; font-size: 24px; font-weight: 700;
    color: #10141c; background: radial-gradient(circle at 35% 30%, #ffe9a8, #ffcf52 60%, #d9a222);
    border: 3px solid #fff3d0; box-shadow: 0 4px 14px rgba(0,0,0,.4);
  }
  .map-node .label {
    font-size: 13px; font-weight: 600; color: var(--ink);
    background: rgba(16,20,28,.7); padding: 3px 9px; border-radius: 7px; white-space: nowrap;
  }
  .map-node .diff { font-size: 11px; color: var(--muted); }
  .map-node.locked { cursor: default; opacity: 0.7; }
  .map-node.locked .disc {
    width: 42px; height: 42px; font-size: 16px;
    background: radial-gradient(circle at 35% 30%, #58606e, #343a46 60%, #232833);
    border: 2px solid #4a515e; color: #aab2c4; box-shadow: 0 3px 9px rgba(0,0,0,.3);
  }
  .map-node.locked .label { color: var(--muted); background: rgba(16,20,28,.45); }
  .map-node.locked .diff { display: none; }
  .map-node.done .disc { border-color: #5ad1a5; }
  .map-node:not(.locked):hover .disc { transform: scale(1.08); transition: transform .1s; }
  .map-node .node-stars { color: var(--gold); font-size: 12px; letter-spacing: 2px; }

  #saveControls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  #saveTip { color: var(--muted); font-size: 12px; min-height: 16px; }

  /* star upgrade store — Kingdom-Rush-style wooden upgrade board */
  #storeModal {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(10, 12, 18, 0.7);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  #storeModal[hidden] { display: none; }
  #storePanel {
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.14) 0 2px, transparent 2px 52px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 3px, transparent 3px 11px),
      linear-gradient(170deg, #4a3826, #2a1e12);
    border: 3px solid #767c89; outline: 2px solid #1d2027;
    border-radius: 16px;
    box-shadow: 0 18px 60px rgba(0,0,0,.65), inset 0 0 0 2px rgba(0,0,0,.45);
    width: min(760px, 100%); max-height: 92vh; overflow-y: auto;
    padding: 12px 18px 16px;
  }
  #storeTitle {
    text-align: center; font-size: 20px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 5px;
    color: #ffe9a8; text-shadow: 0 2px 0 rgba(0,0,0,.8), 0 0 16px rgba(255,207,82,.3);
    margin-bottom: 10px;
  }
  #storeTracks { display: grid; grid-template-columns: repeat(6, auto);
    gap: 10px 8px; justify-content: center; }
  .track { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .track .slot {
    position: relative; display: flex; flex-direction: column; align-items: center;
    gap: 8px; padding: 9px 7px;
    background: linear-gradient(180deg, #221810, #150e07);
    border-radius: 40px;
    box-shadow: inset 0 3px 10px rgba(0,0,0,.85), 0 1px 0 rgba(255,255,255,.07);
  }
  .track .rail {
    position: absolute; top: 24px; bottom: 24px; width: 4px;
    background: #4b3a24; border-radius: 2px;
  }
  .rank {
    position: relative; z-index: 1;
    width: 38px; height: 38px; border-radius: 50%; padding: 0;
    display: grid; place-items: center; font-size: 16px;
    border: 3px solid #e0a83a; cursor: default;
    box-shadow: 0 3px 8px rgba(0,0,0,.5);
  }
  .rank.bought {
    background: radial-gradient(circle at 35% 30%, var(--tc-light), var(--tc-dark) 75%);
    box-shadow: 0 0 12px rgba(255,207,82,.3), 0 3px 8px rgba(0,0,0,.5);
  }
  .rank.next { background: radial-gradient(circle at 35% 30%, #6b5a2c, #372c12 75%); cursor: pointer; }
  .rank.next.affordable { border-color: #ffcf52; animation: rankPulse 1.1s ease-in-out infinite; }
  .rank.next:hover { filter: brightness(1.2); }
  @keyframes rankPulse {
    0%, 100% { box-shadow: 0 0 4px rgba(255,207,82,.35), 0 3px 8px rgba(0,0,0,.5); }
    50%      { box-shadow: 0 0 16px rgba(255,207,82,.75), 0 3px 8px rgba(0,0,0,.5); }
  }
  .rank.locked { filter: grayscale(1) brightness(.5); border-color: #5a5346; }
  .rank .cost {
    position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%);
    background: #10141c; border: 1.5px solid #e0a83a; border-radius: 8px;
    font-size: 11px; font-weight: 700; padding: 0 6px; color: var(--gold);
    white-space: nowrap;
  }
  .track-icon {
    width: 52px; height: 52px; display: grid; place-items: center; font-size: 25px;
    background: linear-gradient(160deg, #2c313b, #13161c);
    border: 3px solid #7b828f; border-radius: 10px;
    box-shadow: inset 0 2px 7px rgba(0,0,0,.75), 0 2px 6px rgba(0,0,0,.4);
  }
  #storeFoot { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  #storeStars {
    font-size: 19px; font-weight: 800; color: var(--gold); letter-spacing: 1px;
    background: rgba(0,0,0,.4); padding: 6px 16px; border-radius: 10px;
    border: 2px solid #767c89; font-variant-numeric: tabular-nums;
  }
  #storeFoot button {
    text-transform: uppercase; letter-spacing: 2px; font-weight: 800; font-size: 14px;
    color: #dfe4ee; padding: 9px 24px; border-radius: 10px; cursor: pointer;
    background: linear-gradient(180deg, #3c414c, #1e222a);
    border: 2px solid #7b828f; box-shadow: 0 3px 8px rgba(0,0,0,.45);
  }
  #storeFoot button:hover { filter: brightness(1.15); }
  #storeClose { margin-left: auto; color: #ffe9a8; }
  #storeTip {
    position: fixed; z-index: 30; max-width: 250px; pointer-events: none;
    background: rgba(23, 16, 9, 0.96); border: 2px solid #e0a83a; border-radius: 10px;
    padding: 8px 11px; font-size: 12.5px; line-height: 1.45; color: #ffe9c9;
    box-shadow: 0 8px 24px rgba(0,0,0,.55);
  }
  #storeTip b { color: #ffcf52; }
  #storeTip[hidden] { display: none; }

  /* hero picker — same wooden upgrade-board look as the star store */
  #heroModal {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(10, 12, 18, 0.7);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  #heroModal[hidden] { display: none; }
  #heroPanel {
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.14) 0 2px, transparent 2px 52px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 3px, transparent 3px 11px),
      linear-gradient(170deg, #4a3826, #2a1e12);
    border: 3px solid #767c89; outline: 2px solid #1d2027;
    border-radius: 16px;
    box-shadow: 0 18px 60px rgba(0,0,0,.65), inset 0 0 0 2px rgba(0,0,0,.45);
    width: min(800px, 100%); max-height: 92vh; overflow-y: auto;
    padding: 12px 18px 16px;
  }
  #heroTitle {
    text-align: center; font-size: 20px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 5px;
    color: #ffe9a8; text-shadow: 0 2px 0 rgba(0,0,0,.8), 0 0 16px rgba(255,207,82,.3);
    margin-bottom: 10px;
  }
  #heroCards { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .hero-card {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    width: 138px; padding: 12px 9px;
    background: linear-gradient(180deg, #221810, #150e07);
    border: 3px solid #6b5a3a; border-radius: 14px; cursor: pointer;
    box-shadow: inset 0 3px 10px rgba(0,0,0,.85), 0 1px 0 rgba(255,255,255,.07);
  }
  .hero-card:hover { border-color: #9a8455; filter: brightness(1.1); }
  .hero-card.selected {
    border-color: #ffcf52;
    box-shadow: 0 0 16px rgba(255,207,82,.4), inset 0 3px 10px rgba(0,0,0,.85);
  }
  .hero-card .hicon {
    width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center;
    font-size: 27px; border: 3px solid #e0a83a;
    background: radial-gradient(circle at 35% 30%, var(--hc-light), var(--hc-dark) 75%);
    box-shadow: 0 3px 8px rgba(0,0,0,.5);
  }
  .hero-card b { font-size: 13px; color: #ffe9c9; text-align: center; }
  .hero-card .htag { color: #cbb98f; font-size: 10.5px; text-align: center; line-height: 1.35; min-height: 28px; }
  .hero-card .hstats {
    font-size: 11px; color: #ffe9c9; font-variant-numeric: tabular-nums;
    background: rgba(0,0,0,.35); border-radius: 6px; padding: 3px 7px; text-align: center;
  }
  .hero-card .hpick {
    font-size: 10px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;
    color: #10141c; background: #ffcf52; border-radius: 6px; padding: 2px 0; width: 100%;
    text-align: center; visibility: hidden;
  }
  .hero-card.selected .hpick { visibility: visible; }
  #heroFoot { display: flex; justify-content: center; margin-top: 16px; }
  #heroFoot button {
    text-transform: uppercase; letter-spacing: 2px; font-weight: 800; font-size: 14px;
    color: #ffe9a8; padding: 9px 24px; border-radius: 10px; cursor: pointer;
    background: linear-gradient(180deg, #3c414c, #1e222a);
    border: 2px solid #7b828f; box-shadow: 0 3px 8px rgba(0,0,0,.45);
  }
  #heroFoot button:hover { filter: brightness(1.15); }
  #heroPickBtn { display: flex; align-items: center; gap: 8px; }
  #heroPickBtn .hbicon { font-size: 18px; }

  /* save-slot picker */
  #slotList {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px; width: min(900px, 100%);
  }
  .slot-card {
    background: var(--panel); border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 8px;
  }
  .slot-card.empty { border-style: dashed; opacity: .85; }
  .slot-title { font-size: 17px; font-weight: 700; }
  .slot-status { font-size: 13px; color: var(--muted); }
  .slot-when { font-size: 11px; color: var(--muted); opacity: .8; }
  .slot-actions { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .slot-actions button { flex: 1; }
  .diff-btn { padding: 9px 8px; font-size: 13px; min-width: 0; }
  .diff-btn.diff-easy { background: var(--accent); color: #0c1a14; }
  .diff-btn.diff-normal { background: var(--gold); color: #1b1f2a; }
  .diff-btn.diff-hard { background: var(--danger); color: #1b1f2a; }
</style>
</head>
<body>
<div id="app">
  <h1>⚔️ Tower Realm</h1>

  <!-- SAVE SLOT PICKER -->
  <div id="slotScreen">
    <div class="sub" id="slotSub">Choose a save slot.</div>
    <div id="slotList"></div>
  </div>

  <!-- WORLD MAP: stage select, then the ten levels of the chosen stage -->
  <div id="mapScreen">
    <div class="sub" id="mapSub">Choose a stage.</div>
    <div id="stageBoard"></div>
    <div id="mapBoard" hidden>
      <svg id="mapTrail" viewBox="0 0 900 560" preserveAspectRatio="none"></svg>
      <div id="mapNodes"></div>
    </div>
    <button id="backToStages" class="secondary" hidden>◀ All stages</button>
    <div id="saveControls">
      <button id="heroPickBtn"><span class="hbicon">🦸</span><span id="heroPickLabel">Choose hero</span></button>
      <button id="storeBtn">⭐ Upgrade store</button>
      <button id="slotsBtn" class="secondary">🗂 Switch slot</button>
      <button id="wipeBtn" class="secondary">🗑 Erase progress</button>
      <span id="saveTip"></span>
    </div>

    <!-- star upgrade store (modal over the map) -->
    <div id="storeModal" hidden>
      <div id="storePanel">
        <div id="storeTitle">Upgrades</div>
        <div id="storeTracks"></div>
        <div id="storeFoot">
          <span id="storeStars"></span>
          <button id="storeReset">Reset</button>
          <button id="storeClose">Done</button>
        </div>
      </div>
      <div id="storeTip" hidden></div>
    </div>

    <!-- hero picker (modal over the map) -->
    <div id="heroModal" hidden>
      <div id="heroPanel">
        <div id="heroTitle">Champions</div>
        <div id="heroCards"></div>
        <div id="heroFoot">
          <button id="heroClose">Done</button>
        </div>
      </div>
    </div>
  </div>

  <!-- GAMEPLAY VIEW -->
  <div id="playView">
    <div class="sub">Click a build spot to build · click a tower to upgrade or sell · click your hero then a spot to send it there · stop the creeps before they reach the castle.</div>
    <div id="hud">
      <span class="stat lvl">🗺 <b id="levelName">—</b></span>
      <span class="stat">💰 Gold <b id="gold">0</b></span>
      <span class="stat lives">❤️ Lives <b id="lives">0</b></span>
      <span class="stat wave">🌊 Wave <b id="wave">0</b>/<span id="waveMax">0</span></span>
      <span class="stat hero">🦸 Hero <b id="heroHp">—</b></span>
    </div>
    <div id="stage">
      <canvas id="game" width="900" height="560"></canvas>
      <div id="buildMenu"></div>
      <div id="towerMenu"></div>
      <div id="abilityBar">
        <button id="heroPortrait" title="Select hero">
          <span class="icon">🦸</span>
          <div class="lvl-badge" id="heroLvl">1</div>
          <div class="xp-bar"><div class="xp-fill" id="heroPortraitXp"></div></div>
          <div class="hp-bar"><div class="hp-fill" id="heroPortraitHp"></div></div>
          <div class="downed-label" id="heroPortraitDowned"></div>
        </button>
        <button id="abilitySoldiers" class="ability-btn" title="Call in 2 soldiers for 7s (15s cooldown)">
          <span class="icon">⚔️</span>
          <div class="cd-label" id="abilitySoldiersCd"></div>
        </button>
        <button id="abilityFire" class="ability-btn" title="Set all enemies on fire (15s cooldown)">
          <span class="icon">🔥</span>
          <div class="cd-label" id="abilityFireCd"></div>
        </button>
      </div>
      <div id="overlay">
        <h2 id="overlayTitle"></h2>
        <div class="sub" id="overlaySub"></div>
        <div id="overlayBtns"></div>
      </div>
    </div>
    <div id="controls">
      <button id="startBtn">Start wave</button>
      <button id="speedBtn" class="secondary">Speed: 1×</button>
      <button id="pauseBtn" class="secondary">⏸ Pause</button>
      <button id="resetBtn" class="secondary">↺ Reset</button>
      <button id="mapBtn" class="secondary">🗺 Map</button>
      <span id="tip"></span>
    </div>
    <!-- both legends are filled in by ui.js — the tower one from TOWER_TYPES,
         the enemy one from whichever kit this stage fields -->
    <div id="towerLegend" class="legend"></div>
    <div id="enemyLegend" class="legend"></div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
